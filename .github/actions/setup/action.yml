name: Setup
description: >-
  Install Vite+ (vp), Node.js from .node-version and pnpm from packageManager, install dependencies
  with a frozen lockfile (pnpm store cached by setup-vp), and optionally restore the Vite+ task cache.

inputs:
  task-cache:
    description: Restore node_modules/.vite/task-cache and save it when the job succeeds.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Set up Vite+, Node.js and pnpm, install dependencies
      uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
      with:
        node-version-file: .node-version
        cache: true
        cache-toolchain: true
        run-install: |
          - args: ["--frozen-lockfile"]

    - name: Vite+ task cache
      if: inputs.task-cache == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: node_modules/.vite/task-cache
        key: vite-task-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          vite-task-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-
          vite-task-${{ runner.os }}-${{ runner.arch }}-
